<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Preference Selection</title>
</head>
<body>
    <header><h1>Choose Your Travel Preferences</h1></header>
    <main>
        <form action="#" method="get">
            <p><label for="country">Country</label><br><select id="country" name="country"><option selected value="india">India</option><option value="nepal">Nepal</option><option value="japan">Japan</option></select></p>
            <p><label for="state">State</label><br><select id="state" name="state"><option selected value="uttar-pradesh">Uttar Pradesh</option><option value="rajasthan">Rajasthan</option><option value="himachal-pradesh">Himachal Pradesh</option></select></p>
            <p><label for="city">City</label><br><select id="city" name="city"><option selected value="mathura">Mathura</option><option value="agra">Agra</option><option value="jaipur">Jaipur</option></select></p>
            <p><label for="place">Favorite Tourist Place</label><br><select id="place" name="place"><option selected value="taj-mahal">Taj Mahal</option><option value="govardhan-hill">Govardhan Hill</option><option value="amber-fort">Amber Fort</option></select></p>
        </form>
        <p>Your current selection is India, Uttar Pradesh, Mathura, with the Taj Mahal as your favorite tourist place.</p>
    </main>
</body>
</html>
