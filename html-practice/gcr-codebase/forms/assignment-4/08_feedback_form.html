<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Feedback</title>
</head>
<body>
    <h1>Share Your Feedback</h1>
    <form action="#" method="post">
        <p><label for="feedback">Your feedback</label><br><textarea id="feedback" name="feedback" rows="6" cols="45" required></textarea></p>
        <fieldset>
            <legend>How would you rate the course?</legend>
            <p><input id="rating-good" name="rating" type="radio" value="good" required><label for="rating-good">Good</label></p>
            <p><input id="rating-average" name="rating" type="radio" value="average"><label for="rating-average">Average</label></p>
            <p><input id="rating-poor" name="rating" type="radio" value="poor"><label for="rating-poor">Poor</label></p>
        </fieldset>
        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
