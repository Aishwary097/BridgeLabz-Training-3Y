<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <p><label for="contact-name">Full Name</label><br><input id="contact-name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required></p>
        <p><label for="contact-email">Email</label><br><input id="contact-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required></p>
        <p><label for="subject">Subject</label><br><input id="subject" name="subject" type="text" placeholder="What is your message about?" required></p>
        <p><label for="message">Message</label><br><textarea id="message" name="message" rows="7" cols="45" placeholder="Write your message here" required></textarea></p>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
