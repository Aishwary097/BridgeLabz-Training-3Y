<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Example</h1>
    <p>The query text contains a space and an ampersand. The link encodes the space as %20 and the ampersand as %26.</p>
    <p><a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS</a></p>
</body>
</html>
