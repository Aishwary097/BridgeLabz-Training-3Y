<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload an Image</title>
</head>
<body>
    <h1>Upload an Image</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="image-file">Choose an image file</label>
        <input id="image-file" name="image" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
        <p>Allowed file types: JPG, JPEG, and PNG images.</p>
        <button type="submit">Upload Image</button>
    </form>
</body>
</html>
