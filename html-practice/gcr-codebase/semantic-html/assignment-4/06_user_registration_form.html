<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Registration</title>
</head>
<body>
    <h1>Create an Account</h1>
    <form action="#" method="post">
        <p><label for="full-name">Full Name</label><br><input id="full-name" name="full-name" type="text" autocomplete="name" required></p>
        <p><label for="email">Email Address</label><br><input id="email" name="email" type="email" autocomplete="email" required></p>
        <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="new-password" required></p>
        <p><label for="confirm-password">Confirm Password</label><br><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required></p>
        <button type="submit">Register</button>
    </form>
</body>
</html>
