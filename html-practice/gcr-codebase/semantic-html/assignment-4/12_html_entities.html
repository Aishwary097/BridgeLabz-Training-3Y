<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML Entities</title>
</head>
<body>
    <h1>HTML Entity Examples</h1>
    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Double quotation mark: &quot;</p>
    <p>Apostrophe: &apos;</p>
    <p>Copyright: &copy;</p>
    <p>Trademark: &trade;</p>
    <p>Registered trademark: &reg;</p>
</body>
</html>
