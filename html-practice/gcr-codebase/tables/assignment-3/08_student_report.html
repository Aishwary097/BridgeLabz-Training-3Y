<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Academic Report</title>
</head>
<body>
    <header><h1>GLA University, Mathura</h1><p>Student Academic Report</p></header>
    <main>
        <table>
            <caption title="Illustrative marks for five subjects">Third-Year Engineering Student Report</caption>
            <thead><tr><th scope="col">Subject</th><th scope="col">Maximum Marks</th><th scope="col">Marks Obtained</th></tr></thead>
            <tbody>
                <tr><th scope="row">Engineering Mathematics</th><td>100</td><td>88</td></tr>
                <tr><th scope="row">Data Structures</th><td>100</td><td>91</td></tr>
                <tr><th scope="row">Database Systems</th><td>100</td><td>84</td></tr>
                <tr><th scope="row">Computer Networks</th><td>100</td><td>95</td></tr>
                <tr><th scope="row">Web Development</th><td>100</td><td>89</td></tr>
            </tbody>
            <tfoot>
                <tr><th scope="row" colspan="2">Total</th><td>447 / 500</td></tr>
                <tr><th scope="row" colspan="2">Percentage</th><td>89.4%</td></tr>
            </tfoot>
        </table>
    </main>
</body>
</html>
