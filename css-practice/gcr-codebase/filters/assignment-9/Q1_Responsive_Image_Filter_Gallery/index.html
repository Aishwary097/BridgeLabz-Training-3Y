    <section class="intro"><p class="eyebrow">A responsive photo journal</p><h1>Color, then<br><span>clarity.</span></h1><p>Six frames, six different treatments. Hover to return each photograph to its original color.</p><div class="gallery-meta"><span>LIGHT & LANDSCAPE</span><span>01 — 06</span></div></section>
    <section class="photo-grid" aria-label="CSS image filter gallery">
      <figure class="photo-card"><div class="photo"><img class="blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Still mountain lake beneath a cloudy sky"></div><figcaption><span>01 / SOFT FOCUS</span><strong>Blur</strong></figcaption></figure>
      <figure class="photo-card"><div class="photo"><img class="gray" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Sunlight between tall forest trees"></div><figcaption><span>02 / QUIET TONES</span><strong>Grayscale</strong></figcaption></figure>
      <figure class="photo-card"><div class="photo"><img class="sepia" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="Morning light over an open field"></div><figcaption><span>03 / WARM MEMORY</span><strong>Sepia</strong></figcaption></figure>

      <figure class="photo-card"><div class="photo"><img class="hue" src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="A green woodland path with dappled light"></div><figcaption><span>06 / COLOR SHIFT</span><strong>Hue rotate</strong></figcaption></figure>
