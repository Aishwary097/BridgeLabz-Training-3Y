<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discover a New Idea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-content">
        <p class="eyebrow">A little inspiration</p>
        <h1>Turn the card to discover an idea</h1>
        <article class="flip-card" tabindex="0" aria-label="Interactive idea card. Hover or focus to turn it over.">
            <div class="card-inner">
                <section class="card-face card-front">
                    <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Notebook and pen ready for writing">
                    <div><p class="card-label">A thought to keep</p><h2>Make time to learn</h2></div>
                </section>
                <section class="card-face card-back">
                    <p class="card-label">The idea</p>
                    <h2>Small steps create lasting progress.</h2>
                    <p>Choose one skill, practice it with care, and take a moment to notice what you have learned.</p>
                </section>
            </div>
        </article>
        <p class="hint">Hover over the card or focus it with your keyboard.</p>
    </main>
</body>
</html>
